# Hestian remote unit: Cheap Yellow Display (ESP32-2432S028R, 2-USB variant)
# with an SCD40 + BME680 on the CN1 connector.
#
# The remote is a thin client to Home Assistant for the thermostat: it reads
# the climate entity's state and writes setpoint / mode changes back with
# climate.* actions. Its own sensors are reported to HA like any ESPHome node.
#
# Included from hestian-remote-N.yaml via `packages:`. Required substitutions:
#   device_name, friendly_name, room, project_role, thermostat_entity,
#   display_model, bme680_address, units_label, setpoint_step
#
# Wiring (see docs/wiring.md):
#   CN1: GND, GPIO22 (SCL), GPIO27 (SDA), 3V3  ->  both sensors in parallel
#   Everything else is on-board (display, touch, backlight, RGB LED).
#
# Screen (landscape): left column = thermostat, right column = this room.

esp32:
  board: esp32dev
  framework:
    type: arduino

esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: wake_screen
      - script.execute: refresh_ui

# ---------------------------------------------------------------------------
# Buses
# ---------------------------------------------------------------------------
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

i2c:
  sda: GPIO27
  scl: GPIO22
  scan: true
  frequency: 100kHz

# ---------------------------------------------------------------------------
# Display, backlight, touch, LED
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 2000Hz
  - platform: ledc
    pin: GPIO4
    id: led_r
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_g
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_b
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "Screen Backlight"
    entity_category: config
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
  - platform: rgb
    id: status_led
    name: "Status LED"
    red: led_r
    green: led_g
    blue: led_b
    entity_category: config
    restore_mode: ALWAYS_OFF

display:
  - platform: mipi_spi
    id: tft
    spi_id: tft_spi
    model: ${display_model}
    invert_colors: false
    color_order: BGR
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: tft_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      mirror_x: true
    on_touch:
      - script.execute: wake_screen

# ---------------------------------------------------------------------------
# Local sensors
# ---------------------------------------------------------------------------
sensor:
  # SCD40 in low-power mode: 30 s cadence, about a fifth of the self-heating
  # of periodic mode. CO2 only; its temp/RH are hidden (the BME680 is better).
  - platform: scd4x
    address: 0x62
    update_interval: 60s
    measurement_mode: low_power_periodic
    automatic_self_calibration: true
    ambient_pressure_compensation_source: local_pressure
    co2:
      name: "CO2"
      id: local_co2
      on_value:
        - script.execute: refresh_ui
        - script.execute: co2_led
    temperature:
      name: "Temperature (SCD40)"
      internal: true
    humidity:
      name: "Humidity (SCD40)"
      internal: true

  # BME680: temperature / humidity / pressure / gas. Heater on for gas.
  - platform: bme680
    address: ${bme680_address}
    update_interval: 30s
    iir_filter: 3x
    temperature:
      name: "Temperature"
      id: local_temp
      oversampling: 16x
      filters:
        - lambda: return x + id(temp_offset).state;
      on_value:
        - script.execute: refresh_ui
    humidity:
      name: "Humidity"
      id: local_humidity
      oversampling: 8x
      on_value:
        - script.execute: refresh_ui
    pressure:
      name: "Pressure"
      id: local_pressure
      oversampling: 4x
      on_value:
        - script.execute: refresh_ui
    gas_resistance:
      name: "Gas Resistance"
      id: local_gas
      entity_category: diagnostic

  # IAQ index (0 = excellent, 500 = terrible) from gas resistance + humidity.
  # Same formula as the air-quality nodes; tune gas_baseline after burn-in.
  - platform: template
    name: "Air Quality Index"
    id: iaq_index
    icon: mdi:gauge
    unit_of_measurement: "IAQ"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      if (std::isnan(id(local_gas).state) || std::isnan(id(local_humidity).state)) return NAN;
      const float gas_kohms = id(local_gas).state / 1000.0f;
      const float humidity = id(local_humidity).state;
      float hum_score;
      if (humidity >= 38 && humidity <= 42) hum_score = 25.0f;
      else if (humidity < 38) hum_score = 25.0f / 38.0f * humidity;
      else hum_score = (25.0f / (100.0f - 42.0f)) * (100.0f - humidity);
      const float baseline = id(gas_baseline).state;
      const float gas_offset = baseline - gas_kohms;
      float gas_score = 75.0f;
      if (gas_offset > 0) gas_score = (1.0f - (gas_offset / baseline)) * 75.0f;
      return (100.0f - (hum_score + gas_score)) * 5.0f;
    on_value:
      - script.execute: refresh_ui

  # Thermostat state pulled from Home Assistant (in HA's display units).
  - platform: homeassistant
    id: stat_current
    entity_id: ${thermostat_entity}
    attribute: current_temperature
    on_value:
      - script.execute: refresh_ui
  - platform: homeassistant
    id: stat_low
    entity_id: ${thermostat_entity}
    attribute: target_temp_low
    on_value:
      - script.execute: refresh_ui
  - platform: homeassistant
    id: stat_high
    entity_id: ${thermostat_entity}
    attribute: target_temp_high
    on_value:
      - script.execute: refresh_ui
  - platform: homeassistant
    id: stat_single
    entity_id: ${thermostat_entity}
    attribute: temperature
    on_value:
      - script.execute: refresh_ui

text_sensor:
  - platform: homeassistant
    id: stat_mode
    entity_id: ${thermostat_entity}
    on_value:
      - script.execute: refresh_ui
  - platform: homeassistant
    id: stat_action
    entity_id: ${thermostat_entity}
    attribute: hvac_action
    on_value:
      - script.execute: refresh_ui

  - platform: template
    name: "Air Quality"
    id: iaq_text
    icon: mdi:air-filter
    update_interval: 60s
    lambda: |-
      const float iaq = id(iaq_index).state;
      if (std::isnan(iaq)) return {"Unknown"};
      if (iaq <= 50) return {"Excellent"};
      if (iaq <= 100) return {"Good"};
      if (iaq <= 150) return {"Lightly Polluted"};
      if (iaq <= 200) return {"Moderately Polluted"};
      if (iaq <= 250) return {"Heavily Polluted"};
      if (iaq <= 350) return {"Severely Polluted"};
      return {"Extremely Polluted"};

# ---------------------------------------------------------------------------
# Config entities (HA device page)
# ---------------------------------------------------------------------------
number:
  - platform: template
    id: temp_offset
    name: "Temperature Offset"
    icon: mdi:thermometer-plus
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -5
    max_value: 5
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: gas_baseline
    name: "Gas Baseline"
    icon: mdi:gauge
    entity_category: config
    unit_of_measurement: "kΩ"
    min_value: 50
    max_value: 1000
    step: 10
    initial_value: 250
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: screen_timeout
    name: "Screen Timeout"
    icon: mdi:monitor-off
    entity_category: config
    unit_of_measurement: "s"
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 60
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: screen_brightness
    name: "Screen Brightness"
    icon: mdi:brightness-6
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    mode: slider
    on_value:
      - light.turn_on:
          id: backlight
          brightness: !lambda return x / 100.0f;

switch:
  - platform: template
    id: co2_led_enabled
    name: "CO2 Status LED"
    icon: mdi:led-on
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - light.turn_off: status_led
    on_turn_on:
      - script.execute: co2_led

# ---------------------------------------------------------------------------
# State and scripts
# ---------------------------------------------------------------------------
globals:
  - id: editing
    type: bool
    initial_value: "false"
  - id: pending_low
    type: float
    initial_value: "0"
  - id: pending_high
    type: float
    initial_value: "0"
  - id: pending_single
    type: float
    initial_value: "0"

script:
  - id: wake_screen
    mode: restart
    then:
      - lvgl.resume:
      - light.turn_on:
          id: backlight
          brightness: !lambda return id(screen_brightness).state / 100.0f;

  # which: 0 = heat (low), 1 = cool (high). dir: +1 / -1 in HA display units.
  - id: nudge
    mode: queued
    parameters:
      which: int
      dir: int
    then:
      - script.execute: wake_screen
      - lambda: |-
          const float step = ${setpoint_step};
          if (!id(editing)) {
            id(pending_low) = id(stat_low).state;
            id(pending_high) = id(stat_high).state;
            id(pending_single) = id(stat_single).state;
            id(editing) = true;
          }
          const std::string mode = id(stat_mode).state;
          if (mode == "heat_cool") {
            if (which == 1) id(pending_high) += dir * step;
            else id(pending_low) += dir * step;
            if (id(pending_high) < id(pending_low) + step) {
              if (which == 1) id(pending_low) = id(pending_high) - step;
              else id(pending_high) = id(pending_low) + step;
            }
          } else {
            id(pending_single) += dir * step;
          }
      - script.execute: refresh_ui
      - script.execute: commit

  - id: commit
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            lambda: return id(stat_mode).state == "heat_cool";
          then:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${thermostat_entity}
                  target_temp_low: !lambda return id(pending_low);
                  target_temp_high: !lambda return id(pending_high);
          else:
            - homeassistant.action:
                action: climate.set_temperature
                data:
                  entity_id: ${thermostat_entity}
                  temperature: !lambda return id(pending_single);
      - delay: 2s              # let HA push the new attributes back
      - lambda: id(editing) = false;
      - script.execute: refresh_ui

  - id: cycle_mode
    then:
      - script.execute: wake_screen
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: ${thermostat_entity}
            hvac_mode: !lambda |-
              const std::string m = id(stat_mode).state;
              if (m == "heat_cool") return std::string("heat");
              if (m == "heat") return std::string("cool");
              if (m == "cool") return std::string("fan_only");
              if (m == "fan_only") return std::string("off");
              return std::string("heat_cool");

  - id: co2_led
    then:
      - if:
          condition:
            switch.is_on: co2_led_enabled
          then:
            - lambda: |-
                const float co2 = id(local_co2).state;
                if (std::isnan(co2)) return;
                auto call = id(status_led).turn_on();
                call.set_brightness(0.15f);
                if (co2 < 1000) call.set_rgb(0.0f, 1.0f, 0.0f);
                else if (co2 < 1500) call.set_rgb(1.0f, 0.6f, 0.0f);
                else call.set_rgb(1.0f, 0.0f, 0.0f);
                call.perform();

  - id: refresh_ui
    mode: restart
    then:
      - lambda: |-
          char buf[24];
          const std::string mode = id(stat_mode).state;
          const std::string action = id(stat_action).state;
          const bool two_point = mode == "heat_cool";

          // Thermostat column
          if (std::isnan(id(stat_current).state)) {
            lv_label_set_text(id(lbl_stat_temp), "--");
          } else {
            snprintf(buf, sizeof(buf), "%.0f°", id(stat_current).state);
            lv_label_set_text(id(lbl_stat_temp), buf);
          }
          const float lo = id(editing) ? id(pending_low) : id(stat_low).state;
          const float hi = id(editing) ? id(pending_high) : id(stat_high).state;
          const float single = id(editing) ? id(pending_single) : id(stat_single).state;
          if (two_point) {
            snprintf(buf, sizeof(buf), std::isnan(lo) ? "--" : "%.0f", lo);
            lv_label_set_text(id(lbl_heat), buf);
            snprintf(buf, sizeof(buf), std::isnan(hi) ? "--" : "%.0f", hi);
            lv_label_set_text(id(lbl_cool), buf);
            lv_label_set_text(id(lbl_heat_cap), "HEAT TO");
            lv_label_set_text(id(lbl_cool_cap), "COOL TO");
            lv_obj_clear_flag(id(row_cool), LV_OBJ_FLAG_HIDDEN);
          } else if (mode == "heat" || mode == "cool") {
            snprintf(buf, sizeof(buf), std::isnan(single) ? "--" : "%.0f", single);
            lv_label_set_text(id(lbl_heat), buf);
            lv_label_set_text(id(lbl_heat_cap), mode == "heat" ? "HEAT TO" : "COOL TO");
            lv_obj_add_flag(id(row_cool), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_label_set_text(id(lbl_heat), "--");
            lv_label_set_text(id(lbl_heat_cap), "SETPOINT");
            lv_obj_add_flag(id(row_cool), LV_OBJ_FLAG_HIDDEN);
          }

          const char *mode_txt = "OFF";
          if (mode == "heat_cool") mode_txt = "AUTO";
          else if (mode == "heat") mode_txt = "HEAT";
          else if (mode == "cool") mode_txt = "COOL";
          else if (mode == "fan_only") mode_txt = "FAN";
          else if (mode == "unavailable" || mode.empty()) mode_txt = "OFFLINE";
          lv_label_set_text(id(btn_mode_lbl), mode_txt);

          const char *act_txt = "";
          lv_color_t act_col = lv_color_hex(0x808080);
          if (action == "heating") { act_txt = "HEATING"; act_col = lv_color_hex(0xFF6A00); }
          else if (action == "cooling") { act_txt = "COOLING"; act_col = lv_color_hex(0x2A9DFF); }
          else if (action == "fan") { act_txt = "FAN"; act_col = lv_color_hex(0x7ED957); }
          else if (action == "idle") { act_txt = "IDLE"; }
          lv_label_set_text(id(lbl_stat_action), act_txt);
          lv_obj_set_style_text_color(id(lbl_stat_action), act_col, LV_PART_MAIN);

          // Local column
          if (!std::isnan(id(local_temp).state)) {
            const bool f = std::string("${units_label}") == "°F";
            const float t = f ? id(local_temp).state * 9.0f / 5.0f + 32.0f : id(local_temp).state;
            snprintf(buf, sizeof(buf), f ? "%.0f°" : "%.1f°", t);
            lv_label_set_text(id(lbl_local_temp), buf);
          }
          if (!std::isnan(id(local_humidity).state)) {
            snprintf(buf, sizeof(buf), "%.0f%%", id(local_humidity).state);
            lv_label_set_text(id(lbl_local_hum), buf);
          }
          if (!std::isnan(id(local_co2).state)) {
            snprintf(buf, sizeof(buf), "%.0f ppm", id(local_co2).state);
            lv_label_set_text(id(lbl_local_co2), buf);
            lv_color_t c = id(local_co2).state < 1000 ? lv_color_hex(0x7ED957)
                         : id(local_co2).state < 1500 ? lv_color_hex(0xFFB020)
                         : lv_color_hex(0xFF4040);
            lv_obj_set_style_text_color(id(lbl_local_co2), c, LV_PART_MAIN);
          }
          if (!std::isnan(id(iaq_index).state)) {
            snprintf(buf, sizeof(buf), "%.0f  %s", id(iaq_index).state, id(iaq_text).state.c_str());
            lv_label_set_text(id(lbl_local_iaq), buf);
          }
          if (!std::isnan(id(local_pressure).state)) {
            snprintf(buf, sizeof(buf), "%.1f hPa", id(local_pressure).state);
            lv_label_set_text(id(lbl_local_press), buf);
          }

# ---------------------------------------------------------------------------
# UI (LVGL, 320x240 landscape)
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - tft
  touchscreens:
    - tft_touch
  rotation: 90
  buffer_size: 25%
  color_depth: 16
  on_idle:
    timeout: !lambda return (uint32_t) (id(screen_timeout).state * 1000);
    then:
      - light.turn_off: backlight
      - lvgl.pause:
  style_definitions:
    - id: cap_style
      text_color: 0x8A8A8A
      text_font: montserrat_12
    - id: nudge_btn
      width: 34
      height: 34
      radius: 17
      bg_color: 0x2B2B2B
      border_width: 0
      pad_all: 0
      text_font: montserrat_20
  pages:
    - id: main_page
      bg_color: 0x000000
      pad_all: 0
      widgets:
        # ---------------- Thermostat column ----------------
        - obj:
            id: col_stat
            x: 0
            y: 0
            width: 168
            height: 240
            bg_color: 0x0E0E0E
            border_width: 0
            radius: 0
            pad_all: 6
            widgets:
              - label:
                  text: "THERMOSTAT"
                  align: TOP_LEFT
                  styles: cap_style
              - label:
                  id: lbl_stat_action
                  align: TOP_RIGHT
                  text: ""
                  styles: cap_style
              - label:
                  id: lbl_stat_temp
                  align: TOP_MID
                  y: 18
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: montserrat_40
              - button:
                  id: btn_mode
                  align: TOP_MID
                  y: 66
                  width: 90
                  height: 26
                  radius: 13
                  bg_color: 0x2B2B2B
                  on_click:
                    - script.execute: cycle_mode
                  widgets:
                    - label:
                        id: btn_mode_lbl
                        align: CENTER
                        text: "AUTO"
                        text_color: 0xE0E0E0
                        text_font: montserrat_14
              # Heat / single setpoint row
              - obj:
                  id: row_heat
                  align: BOTTOM_MID
                  y: -50
                  width: 156
                  height: 44
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - label:
                        id: lbl_heat_cap
                        align: LEFT_MID
                        x: 2
                        text: "HEAT TO"
                        styles: cap_style
                        text_color: 0xFF8A33
                    - button:
                        align: RIGHT_MID
                        x: -46
                        styles: nudge_btn
                        on_click:
                          - script.execute:
                              id: nudge
                              which: 0
                              dir: -1
                        widgets:
                          - label:
                              align: CENTER
                              text: "-"
                              text_color: 0xFFFFFF
                    - label:
                        id: lbl_heat
                        align: RIGHT_MID
                        x: -40
                        width: 40
                        text_align: CENTER
                        text: "--"
                        text_color: 0xFF8A33
                        text_font: montserrat_22
                    - button:
                        align: RIGHT_MID
                        x: -2
                        styles: nudge_btn
                        on_click:
                          - script.execute:
                              id: nudge
                              which: 0
                              dir: 1
                        widgets:
                          - label:
                              align: CENTER
                              text: "+"
                              text_color: 0xFFFFFF
              # Cool setpoint row (hidden outside heat_cool)
              - obj:
                  id: row_cool
                  align: BOTTOM_MID
                  y: -4
                  width: 156
                  height: 44
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - label:
                        id: lbl_cool_cap
                        align: LEFT_MID
                        x: 2
                        text: "COOL TO"
                        styles: cap_style
                        text_color: 0x5CB8FF
                    - button:
                        align: RIGHT_MID
                        x: -46
                        styles: nudge_btn
                        on_click:
                          - script.execute:
                              id: nudge
                              which: 1
                              dir: -1
                        widgets:
                          - label:
                              align: CENTER
                              text: "-"
                              text_color: 0xFFFFFF
                    - label:
                        id: lbl_cool
                        align: RIGHT_MID
                        x: -40
                        width: 40
                        text_align: CENTER
                        text: "--"
                        text_color: 0x5CB8FF
                        text_font: montserrat_22
                    - button:
                        align: RIGHT_MID
                        x: -2
                        styles: nudge_btn
                        on_click:
                          - script.execute:
                              id: nudge
                              which: 1
                              dir: 1
                        widgets:
                          - label:
                              align: CENTER
                              text: "+"
                              text_color: 0xFFFFFF

        # ---------------- Local room column ----------------
        - obj:
            id: col_local
            x: 168
            y: 0
            width: 152
            height: 240
            bg_color: 0x000000
            border_width: 0
            radius: 0
            pad_all: 6
            widgets:
              - label:
                  text: "${room_label}"
                  align: TOP_LEFT
                  styles: cap_style
              - label:
                  id: lbl_local_temp
                  align: TOP_LEFT
                  y: 16
                  text: "--"
                  text_color: 0xFFFFFF
                  text_font: montserrat_32
              - label:
                  id: lbl_local_hum
                  align: TOP_RIGHT
                  y: 26
                  text: ""
                  text_color: 0xA0A0A0
                  text_font: montserrat_16
              - label:
                  text: "CO2"
                  align: TOP_LEFT
                  y: 66
                  styles: cap_style
              - label:
                  id: lbl_local_co2
                  align: TOP_LEFT
                  y: 80
                  text: "--"
                  text_color: 0x7ED957
                  text_font: montserrat_20
              - label:
                  text: "AIR QUALITY"
                  align: TOP_LEFT
                  y: 112
                  styles: cap_style
              - label:
                  id: lbl_local_iaq
                  align: TOP_LEFT
                  y: 126
                  width: 140
                  long_mode: DOT
                  text: "--"
                  text_color: 0xE0E0E0
                  text_font: montserrat_16
              - label:
                  text: "PRESSURE"
                  align: TOP_LEFT
                  y: 158
                  styles: cap_style
              - label:
                  id: lbl_local_press
                  align: TOP_LEFT
                  y: 172
                  text: "--"
                  text_color: 0xE0E0E0
                  text_font: montserrat_16
