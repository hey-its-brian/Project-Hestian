# Hestian: M5Stack Dial thermostat, HEAT PUMP with auxiliary electric heat.
# This is the apartment's system (old Emerson stat: R, Y, O/B, W2, G, C).
#
# Status: NOT YET HARDWARE TESTED (written 2026-10-05). It is the bench-tested
# hestian-dial-conventional.yaml with the relay layer swapped for a heat
# pump: same sensor, display, knob, menu and safety settings. Bench-test every
# relay before it goes near the air handler (docs/wiring.md, bring-up order).
#
# Hardware:
#   M5Stack Dial v1.1 (ESP32-S3), powered by USB-C
#   PORT.A (GPIO15 = SDA, GPIO13 = SCL, confirmed by testing) -> 5 V -> buck
#   converter -> 3.3 V rail. On that rail and bus, in parallel:
#     SCD40 (onboard pull-ups)          address 0x62
#     Waveshare MCP23017 I/O expander   address set below (check the scan)
#   MCP23017 -> DZS 4-ch relay board, ALL FOUR jumpers on H (high trigger):
#     GPA0 -> IN1 -> relay 1 -> Y   compressor (heat and cool)
#     GPA1 -> IN2 -> relay 2 -> O/B reversing valve
#     GPA2 -> IN3 -> relay 3 -> W2 (and E if separate) aux / emergency strips
#     GPA3 -> IN4 -> relay 4 -> G   blower
#   Relay board VCC/GND from PORT.B red/black (5 V). PORT.B GPIO1/2 unused.
#   R to all four COMs; C capped. All grounds common (buck IN-/OUT- shared).
#
# Heat pump logic (reversing valve is O type, energised to COOL; metered on
# the old stat 2026-09-12):
#   Heat:  O/B off, Y on, G on
#   Cool:  O/B on,  Y on, G on
#   Aux:   W2 added when the room is more than supplemental_heating_delta
#          below the heat setpoint, or heat has run longer than
#          max_heating_run_time
#   Emergency Heat (switch in HA): heat calls run W2 + G, compressor off
#   Idle:  Y, W2, G off (valve left where it is, normal for O type)
#   Off:   everything off, including the valve
#
# UI is identical to the conventional build, plus "Heating + Aux" and
# "Emergency Heat" on the running indicator. Touch: tap home to open the
# menu, tap a menu item to pick it, tap an edit screen to save (not yet
# hardware tested).

esphome:
  name: hestian-dial
  friendly_name: Hestian Dial
  on_boot:
    priority: 1000
    then:
      - output.turn_on: power_hold

esp32:
  board: m5stack-stamps3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret hestian_api_key
  reboot_timeout: 0s   # keep running when HA is down

ota:
  - platform: esphome
    password: !secret hestian_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s   # keep running when WiFi is down
  ap:
    ssid: "Hestian Fallback"

captive_portal:

# UI state
globals:
  - id: ui_screen        # 0 home, 1 menu, 2 edit mode, 3 edit heat, 4 edit cool, 5 edit brightness
    type: int
    initial_value: '0'
  - id: menu_index       # position in the current menu list
    type: int
    initial_value: '0'
  - id: edit_value       # mode index, temperature in F, or brightness %
    type: float
    initial_value: '0'
  - id: last_input_ms
    type: uint32_t
    initial_value: '0'

# Return to home screen after 10s without input
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(ui_screen) != 0 && millis() - id(last_input_ms) > 10000) {
            id(ui_screen) = 0;
            id(dial_display).update();
          }

output:
  - platform: gpio
    pin: GPIO46
    id: power_hold
  - platform: ledc
    pin: GPIO9
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON   # remembers brightness across reboots

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO5

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 56
    glyphs: "0123456789.-°F% "
  - file: "gfonts://Roboto"
    id: font_medium
    size: 30
    glyphs: "0123456789.-° /ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
  - file: "gfonts://Roboto"
    id: font_small
    size: 20
    glyphs: "0123456789.-° /+ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

display:
  - platform: ili9xxx
    id: dial_display
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: true
    update_interval: 5s
    lambda: |-
      auto c2f = [](float c) { return c * 9.0f / 5.0f + 32.0f; };
      int cx = it.get_width() / 2;
      int cy = it.get_height() / 2;
      Color dim = Color(0x66, 0x66, 0x66);
      Color red = Color(0xE5, 0x39, 0x35);
      Color blue = Color(0x2B, 0x9A, 0xF9);
      const char *mode_names[] = {"Off", "Heat", "Cool", "Heat/Cool"};

      auto mode = id(hestian_thermostat).mode;
      auto action = id(hestian_thermostat).action;
      int mi = 0;
      switch (mode) {
        case CLIMATE_MODE_HEAT: mi = 1; break;
        case CLIMATE_MODE_COOL: mi = 2; break;
        case CLIMATE_MODE_HEAT_COOL: mi = 3; break;
        default: break;
      }

      // Ring: Heat = red, Cool = blue, Heat/Cool = follows action, Off = dim
      Color ring = Color(0x1A, 0x1A, 0x1A);
      if (mi == 1) {
        ring = red;
      } else if (mi == 2) {
        ring = blue;
      } else if (mi == 3) {
        ring = Color(0x44, 0x44, 0x44);
        if (action == CLIMATE_ACTION_HEATING) ring = red;
        if (action == CLIMATE_ACTION_COOLING) ring = blue;
      }
      it.filled_circle(cx, cy, 119, ring);
      it.filled_circle(cx, cy, 107, Color::BLACK);

      float lo = roundf(c2f(id(hestian_thermostat).target_temperature_low));
      float hi = roundf(c2f(id(hestian_thermostat).target_temperature_high));
      int s = id(ui_screen);

      if (s == 0) {
        // Home: mode on top
        it.print(cx, cy - 70, id(font_small), Color::WHITE, TextAlign::CENTER, mode_names[mi]);

        // Running indicator
        if (action == CLIMATE_ACTION_HEATING) {
          const char *txt = "Heating";
          if (id(emergency_heat).state) txt = "Emergency Heat";
          else if (id(relay_aux).state) txt = "Heating + Aux";
          it.print(cx, cy - 45, id(font_small), red, TextAlign::CENTER, txt);
        } else if (action == CLIMATE_ACTION_COOLING) {
          it.print(cx, cy - 45, id(font_small), blue, TextAlign::CENTER, "Cooling");
        }

        // Room temperature
        if (id(room_temp).has_state()) {
          it.printf(cx, cy + 5, id(font_big), Color::WHITE, TextAlign::CENTER,
                    "%.1f°F", c2f(id(room_temp).state));
        }

        // Setpoints
        if (mi == 1) {
          it.printf(cx, cy + 60, id(font_small), red, TextAlign::CENTER, "Heat to %.0f°F", lo);
        } else if (mi == 2) {
          it.printf(cx, cy + 60, id(font_small), blue, TextAlign::CENTER, "Cool to %.0f°F", hi);
        } else if (mi == 3) {
          it.printf(cx - 10, cy + 60, id(font_small), red, TextAlign::CENTER_RIGHT, "%.0f", lo);
          it.print(cx, cy + 60, id(font_small), Color::WHITE, TextAlign::CENTER, "/");
          it.printf(cx + 10, cy + 60, id(font_small), blue, TextAlign::CENTER_LEFT, "%.0f", hi);
        }

      } else if (s == 1) {
        // Menu: list depends on mode
        const char *names[] = {"Mode", "Heat", "Cool", "Brightness", "Back"};
        int items_full[] = {0, 1, 2, 3, 4};
        int items_single[] = {0, 3, 4};
        bool single = (mi == 1 || mi == 2);
        int n = single ? 3 : 5;
        int *items = single ? items_single : items_full;
        int sel = id(menu_index) % n;
        for (int i = 0; i < n; i++) {
          int y = cy - (n - 1) * 18 + i * 36;
          it.print(cx, y, id(font_medium), i == sel ? Color::WHITE : dim,
                   TextAlign::CENTER, names[items[i]]);
        }

      } else if (s == 2) {
        // Edit mode
        it.print(cx, cy - 60, id(font_small), dim, TextAlign::CENTER, "Mode");
        it.print(cx, cy, id(font_medium), Color::WHITE, TextAlign::CENTER,
                 mode_names[int(id(edit_value))]);
        it.print(cx, cy + 60, id(font_small), dim, TextAlign::CENTER, "Press to save");

      } else if (s == 3 || s == 4) {
        // Edit heat (3) or cool (4)
        bool heat = (s == 3);
        it.print(cx, cy - 60, id(font_small), dim, TextAlign::CENTER, heat ? "Heat to" : "Cool to");
        it.printf(cx, cy, id(font_big), heat ? red : blue, TextAlign::CENTER,
                  "%.0f°F", id(edit_value));
        it.print(cx, cy + 60, id(font_small), dim, TextAlign::CENTER, "Press to save");

      } else if (s == 5) {
        // Edit brightness
        it.print(cx, cy - 60, id(font_small), dim, TextAlign::CENTER, "Brightness");
        it.printf(cx, cy, id(font_big), Color::WHITE, TextAlign::CENTER,
                  "%.0f%%", id(edit_value));
        it.print(cx, cy + 60, id(font_small), dim, TextAlign::CENTER, "Press to save");
      }

switch:
  - platform: gpio
    id: relay_y
    name: "Relay Compressor (Y)"
    internal: true          # only the thermostat drives the relays
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: relay_expander
      number: 0
      mode:
        output: true
  - platform: gpio
    id: relay_ob
    name: "Relay Reversing Valve (OB)"
    internal: true          # only the thermostat drives the relays
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: relay_expander
      number: 1
      mode:
        output: true
  - platform: gpio
    id: relay_aux
    name: "Relay Aux Heat (W2)"
    internal: true          # only the thermostat drives the relays
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: relay_expander
      number: 2
      mode:
        output: true
  - platform: gpio
    id: relay_fan
    name: "Relay Blower (G)"
    internal: true          # only the thermostat drives the relays
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: relay_expander
      number: 3
      mode:
        output: true

  # Emergency Heat: heat calls use the strips only, compressor stays off.
  # Toggling it during a heat call re-applies the relays straight away.
  - platform: template
    id: emergency_heat
    name: "Emergency Heat"
    icon: mdi:radiator
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          if (id(hestian_thermostat).action == CLIMATE_ACTION_HEATING) {
            id(relay_y).turn_off();
            id(relay_aux).turn_on();
          }
      - component.update: dial_display
    on_turn_off:
      - lambda: |-
          if (id(hestian_thermostat).action == CLIMATE_ACTION_HEATING) {
            id(relay_ob).turn_off();
            id(relay_y).turn_on();
            id(relay_aux).turn_off();   // aux is re-evaluated on the next heat call
          }
      - component.update: dial_display

i2c:
  - id: bus_porta
    sda: GPIO15
    scl: GPIO13
    scan: true
  - id: bus_internal      # Dial's own bus: FT3267 touch, RTC, NFC
    sda: GPIO11
    scl: GPIO12
    scan: false

mcp23017:
  - id: relay_expander
    i2c_id: bus_porta
    address: 0x27   # Waveshare board default as far as known; use what the boot scan reports

sensor:
  - platform: scd4x
    i2c_id: bus_porta
    update_interval: 30s
    co2:
      name: "CO2"
    temperature:
      name: "Temperature"
      id: room_temp
    humidity:
      name: "Humidity"

  - platform: rotary_encoder
    id: dial_encoder
    internal: true
    resolution: 1
    pin_a:
      number: GPIO40
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO41
      mode:
        input: true
        pullup: true
    on_clockwise:
      - lambda: |-
          auto c2f = [](float c) { return c * 9.0f / 5.0f + 32.0f; };
          auto f2c = [](float f) { return (f - 32.0f) * 5.0f / 9.0f; };
          auto mode = id(hestian_thermostat).mode;
          bool single = (mode == CLIMATE_MODE_HEAT || mode == CLIMATE_MODE_COOL);
          int n = single ? 3 : 5;
          int s = id(ui_screen);
          if (s == 0) {
            // Home: adjust the active setpoint (Heat or Cool mode only)
            float lo = roundf(c2f(id(hestian_thermostat).target_temperature_low));
            float hi = roundf(c2f(id(hestian_thermostat).target_temperature_high));
            bool changed = false;
            if (mode == CLIMATE_MODE_HEAT && lo < 89) {
              lo += 1;
              if (hi < lo + 1) hi = lo + 1;
              changed = true;
            } else if (mode == CLIMATE_MODE_COOL && hi < 90) {
              hi += 1;
              changed = true;
            }
            if (changed) {
              auto call = id(hestian_thermostat).make_call();
              call.set_target_temperature_low(f2c(lo));
              call.set_target_temperature_high(f2c(hi));
              call.perform();
            }
          } else {
            id(last_input_ms) = millis();
            if (s == 1) {
              id(menu_index) = (id(menu_index) % n + 1) % n;
            } else if (s == 2) {
              id(edit_value) = (int(id(edit_value)) + 1) % 4;
            } else if (s == 3) {
              float max_f = floorf(c2f(id(hestian_thermostat).target_temperature_high)) - 1;
              if (id(edit_value) < max_f) id(edit_value) += 1;
            } else if (s == 4) {
              if (id(edit_value) < 90) id(edit_value) += 1;
            } else if (s == 5) {
              if (id(edit_value) < 100) id(edit_value) += 10;
              auto call = id(backlight).turn_on();
              call.set_brightness(id(edit_value) / 100.0f);
              call.perform();
            }
          }
      - component.update: dial_display
    on_anticlockwise:
      - lambda: |-
          auto c2f = [](float c) { return c * 9.0f / 5.0f + 32.0f; };
          auto f2c = [](float f) { return (f - 32.0f) * 5.0f / 9.0f; };
          auto mode = id(hestian_thermostat).mode;
          bool single = (mode == CLIMATE_MODE_HEAT || mode == CLIMATE_MODE_COOL);
          int n = single ? 3 : 5;
          int s = id(ui_screen);
          if (s == 0) {
            float lo = roundf(c2f(id(hestian_thermostat).target_temperature_low));
            float hi = roundf(c2f(id(hestian_thermostat).target_temperature_high));
            bool changed = false;
            if (mode == CLIMATE_MODE_HEAT && lo > 50) {
              lo -= 1;
              changed = true;
            } else if (mode == CLIMATE_MODE_COOL && hi > 51) {
              hi -= 1;
              if (lo > hi - 1) lo = hi - 1;
              changed = true;
            }
            if (changed) {
              auto call = id(hestian_thermostat).make_call();
              call.set_target_temperature_low(f2c(lo));
              call.set_target_temperature_high(f2c(hi));
              call.perform();
            }
          } else {
            id(last_input_ms) = millis();
            if (s == 1) {
              id(menu_index) = (id(menu_index) % n + n - 1) % n;
            } else if (s == 2) {
              id(edit_value) = (int(id(edit_value)) + 3) % 4;
            } else if (s == 3) {
              if (id(edit_value) > 50) id(edit_value) -= 1;
            } else if (s == 4) {
              float min_f = ceilf(c2f(id(hestian_thermostat).target_temperature_low)) + 1;
              if (id(edit_value) > min_f) id(edit_value) -= 1;
            } else if (s == 5) {
              if (id(edit_value) > 10) id(edit_value) -= 10;
              auto call = id(backlight).turn_on();
              call.set_brightness(id(edit_value) / 100.0f);
              call.perform();
            }
          }
      - component.update: dial_display

binary_sensor:
  - platform: gpio
    id: dial_button
    internal: true
    pin:
      number: GPIO42
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - script.execute: handle_press

# Shared "press" handler: the knob button and screen taps both run this.
script:
  - id: handle_press
    then:
    - lambda: |-
        id(last_input_ms) = millis();
        auto c2f = [](float c) { return c * 9.0f / 5.0f + 32.0f; };
        auto f2c = [](float f) { return (f - 32.0f) * 5.0f / 9.0f; };
        auto mode = id(hestian_thermostat).mode;
        bool single = (mode == CLIMATE_MODE_HEAT || mode == CLIMATE_MODE_COOL);
        int items_full[] = {0, 1, 2, 3, 4};
        int items_single[] = {0, 3, 4};
        int s = id(ui_screen);
        if (s == 0) {
          id(ui_screen) = 1;
          id(menu_index) = 0;
        } else if (s == 1) {
          int code = single ? items_single[id(menu_index) % 3] : items_full[id(menu_index) % 5];
          if (code == 0) {
            int cur = 0;
            switch (mode) {
              case CLIMATE_MODE_HEAT: cur = 1; break;
              case CLIMATE_MODE_COOL: cur = 2; break;
              case CLIMATE_MODE_HEAT_COOL: cur = 3; break;
              default: break;
            }
            id(edit_value) = cur;
            id(ui_screen) = 2;
          } else if (code == 1) {
            id(edit_value) = roundf(c2f(id(hestian_thermostat).target_temperature_low));
            id(ui_screen) = 3;
          } else if (code == 2) {
            id(edit_value) = roundf(c2f(id(hestian_thermostat).target_temperature_high));
            id(ui_screen) = 4;
          } else if (code == 3) {
            float b = roundf(id(backlight).current_values.get_brightness() * 10.0f) * 10.0f;
            id(edit_value) = b < 10 ? 10 : b;
            id(ui_screen) = 5;
          } else {
            id(ui_screen) = 0;
          }
        } else if (s == 2) {
          const climate::ClimateMode modes[] = {
            climate::CLIMATE_MODE_OFF, climate::CLIMATE_MODE_HEAT,
            climate::CLIMATE_MODE_COOL, climate::CLIMATE_MODE_HEAT_COOL};
          auto call = id(hestian_thermostat).make_call();
          call.set_mode(modes[int(id(edit_value))]);
          call.perform();
          id(ui_screen) = 1;
          id(menu_index) = 0;   // menu list may change with the new mode
        } else if (s == 3) {
          auto call = id(hestian_thermostat).make_call();
          call.set_target_temperature_low(f2c(id(edit_value)));
          call.perform();
          id(ui_screen) = 1;
        } else if (s == 4) {
          auto call = id(hestian_thermostat).make_call();
          call.set_target_temperature_high(f2c(id(edit_value)));
          call.perform();
          id(ui_screen) = 1;
        } else if (s == 5) {
          // brightness is already applied live; just return to the menu
          id(ui_screen) = 1;
        }
    - component.update: dial_display

# Touch: tap the home screen to open the menu, tap a menu item to pick it,
# tap an edit screen to save (same as pressing the knob). The knob still
# adjusts values. Taps are logged with coordinates for checking alignment.
touchscreen:
  - platform: ft5x06
    id: dial_touch
    display: dial_display
    i2c_id: bus_internal
    address: 0x38
    interrupt_pin: GPIO14
    on_touch:
      - lambda: |-
          ESP_LOGD("touch", "tap x=%d y=%d", touch.x, touch.y);
          if (id(ui_screen) == 1) {
            // Map the tap to a menu row (rows are 36 px, centred on screen)
            auto mode = id(hestian_thermostat).mode;
            bool single = (mode == CLIMATE_MODE_HEAT || mode == CLIMATE_MODE_COOL);
            int n = single ? 3 : 5;
            int cy = id(dial_display).get_height() / 2;
            int top = cy - (n - 1) * 18 - 18;
            if (touch.y < top) return;              // above the list: ignore
            int idx = (touch.y - top) / 36;
            if (idx >= n) return;                   // below the list: ignore
            id(menu_index) = idx;
          }
          id(handle_press).execute();

climate:
  - platform: thermostat
    name: "Thermostat"
    id: hestian_thermostat
    sensor: room_temp
    startup_delay: true
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_cooling_off_time: 300s
    min_cooling_run_time: 300s
    min_idle_time: 30s
    heat_deadband: 0.3
    heat_overrun: 0.3
    cool_deadband: 0.3
    cool_overrun: 0.3
    max_heating_run_time: 1800s       # aux strips join after 30 min of heating
    supplemental_heating_delta: 1.5   # or when the room is 1.5 C (~2.7 F) below the heat setpoint
    heat_action:
      - lambda: |-
          if (id(emergency_heat).state) {
            id(relay_y).turn_off();
            id(relay_aux).turn_on();
          } else {
            id(relay_ob).turn_off();   // O type: valve de-energised = heat
            id(relay_y).turn_on();
          }
          id(relay_fan).turn_on();
    supplemental_heating_action:
      - switch.turn_on: relay_aux
    cool_action:
      - switch.turn_on: relay_ob       # O type: energise the valve for cooling
      - switch.turn_on: relay_y
      - switch.turn_on: relay_fan
    idle_action:
      - switch.turn_off: relay_y
      - switch.turn_off: relay_aux
      - switch.turn_off: relay_fan
    off_mode:
      - switch.turn_off: relay_y
      - switch.turn_off: relay_aux
      - switch.turn_off: relay_fan
      - switch.turn_off: relay_ob
    heat_cool_mode:
      - logger.log: "Thermostat set to Heat/Cool"
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 20.5
        default_target_temperature_high: 24.5
