# Home Assistant package for Hestian. Optional; the thermostat works without it.
# Drop into config/packages/ with packages enabled (see docs/home-assistant.md).

input_boolean:
  hestian_away:
    name: Hestian Away
    icon: mdi:home-export-outline

automation:
  - id: hestian_away_preset
    alias: "Hestian: away preset follows Hestian Away"
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.hestian_away
    action:
      - service: climate.set_preset_mode
        target:
          entity_id: climate.hestian_thermostat
        data:
          preset_mode: "{{ 'Away' if trigger.to_state.state == 'on' else 'Home' }}"

  - id: hestian_co2_warning
    alias: "Hestian: CO2 warning"
    mode: single
    trigger:
      - platform: numeric_state
        entity_id:
          - sensor.hestian_remote_1_co2
          - sensor.hestian_remote_2_co2
        above: 1500
        for: "00:10:00"
    action:
      - service: notify.notify
        data:
          title: "CO2 high"
          message: >-
            {{ state_attr(trigger.entity_id, 'friendly_name') }} is at
            {{ states(trigger.entity_id) }} ppm. Open a window or run the fan.
